<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación - MasterCHL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 5px solid #0056b3;
        }
        .logo-img {
            max-width: 150px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1 { color: #222; font-size: 24px; margin: 0 0 5px 0; text-transform: uppercase; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .video-box {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .challenge-box {
            background-color: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
            font-weight: bold;
            color: #004494;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .instructions {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #0056b3;
            text-align: left;
        }
        .instructions strong { color: #004494; }
        
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .error { color: #d9534f; background: #fff5f5; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #f5c6cb; display: none; }
        .success { color: #28a745; background: #f0fff4; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #c3e6cb; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TU LOGO (AQUÍ) -->
        <img src="https://i.ibb.co/h1Z6dp9Z/whtsap.jpg" alt="Logo" class="logo-img">
        
        <h1>Verificación de Identidad</h1>
        <div class="subtitle" style="font-size: 14px; margin-top: -5px; margin-bottom: 10px;">+56 9 3922 9459</div>

        <div id="error-msg" class="error"></div>
        <div id="success-msg" class="success"></div>

        <div id="main-content">
            <div class="video-box">
                <video id="video" autoplay playsinline muted></video>
            </div>

            <div class="challenge-box" id="challenge">
                Presiona "INICIAR CÁMARA" para comenzar.
            </div>

            <button id="startBtn">INICIAR CÁMARA</button>
            <button id="recordBtn" style="display:none;">GRABAR...</button>
            <button id="sendBtn" style="display:none;">ENVIAR A WHATSAPP</button>

            <div class="instructions" id="finalInstruct" style="display:none;">
                <strong>⚠️ IMPORTANTE:</strong> Al enviar, se abrirá WhatsApp. <br>
                <strong>Debes adjuntar el video</strong> que grabaste desde tu galería antes de enviar el mensaje.
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN (CAMBIA ESTOS DATOS) ---
        // TU ENLACE DE GOOGLE SHEETS (CSV)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuh8HzH802xZYnxlX_lBiT2x_vqfcyluC9hEAEtfKll4Oz1CdhD-SaKRqhsJAWWD1_V4SHnOpjuvad/pub?output=csv&t=' + new Date().getTime();
        
        // TU NÚMERO DE WHATSAPP
        const MY_WHATSAPP = "56939229459";

        // --- 2. VARIABLES ---
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const recordBtn = document.getElementById('recordBtn');
        const sendBtn = document.getElementById('sendBtn');
        const challenge = document.getElementById('challenge');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const mainContent = document.getElementById('main-content');

        let stream = null;
        
        // Generar código secreto único para ESTA sesión (SIN PERRO)
        const palabras = ['GATO', 'CASA', 'SOL', 'FUEGO', 'LUNA', 'ROJO', 'AZUL', 'VERDE'];
        const codigoSecreto = palabras[Math.floor(Math.random() * palabras.length)] + '-' + Math.floor(Math.random() * 9 + 1);

        // --- 3. VALIDAR TOKEN ---
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError("Enlace no válido. Faltan los parámetros.");
        } else {
            verificarToken(token);
        }

        async function verificarToken(tokenBuscado) {
            try {
                const res = await fetch(SHEET_URL);
                const data = await res.text().then(t => t.replace(/['"]/g, '').replace(/\r/g, ''));
                const rows = data.split('\n');
                
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    const cols = rows[i].split(',');
                    const link = cols[0] ? cols[0].trim() : '';
                    const estado = cols[1] ? cols[1].trim() : '';

                    if (link === `https://masterchl176-lang.github.io/verificacion-masterchl/?token=${tokenBuscado}`) {
                        if (estado === 'disponible') {
                            iniciarSistema();
                            return;
                        } else if (estado === 'usado') {
                            showError("Este enlace ya ha sido usado anteriormente.");
                            return;
                        }
                    }
                }
                showError("Enlace no encontrado en el sistema.");
            } catch (err) {
                console.error(err);
                showError("Error de conexión. Revisa tu hoja.");
            }
        }

        function showError(msg) {
            mainContent.style.display = 'none';
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function iniciarSistema() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        // --- 4. CÁMARA ---
        startBtn.addEventListener('click', async () => {
            try {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                startBtn.style.display = 'none';
                recordBtn.style.display = 'block';
                challenge.textContent = "Por favor, espera a que empiece la grabación...";
                
                // --- CORRECCIÓN AQUÍ: Llamamos directamente a la función principal ---
                setTimeout(iniciarGrabacion, 1000);
            } catch (err) {
                alert("Error al acceder a la cámara: " + err.message);
            }
        });

        // --- 5. SISTEMA DE CAPTURA POR COMANDO (SIN ERRORES) ---
        function iniciarGrabacion() {
            challenge.textContent = "Preparando cámara... 3 segundos.";
            recordBtn.textContent = "PREPARANDO...";
            recordBtn.disabled = true;
            
            let frameCount = 0;
            const frames = [];
            const maxFrames = 9;

            const capturarFoto = () => {
                if (frameCount >= maxFrames) return;
                
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = video.videoWidth;
                tempCanvas.height = video.videoHeight;
                tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                frames.push(tempCanvas);
                frameCount++;
            };

            // --- PASO 1: Captura inicial ---
            setTimeout(() => {
                challenge.textContent = "1. Mira al frente.";
                capturarFoto(); // Foto 1
                
                // --- PASO 2: Captura a la derecha ---
                setTimeout(() => {
                    challenge.textContent = "2. Gira tu cabeza a la DERECHA.";
                    capturarFoto(); // Foto 2
                    
                    setTimeout(() => {
                        capturarFoto(); // Foto 3
                        
                        // --- PASO 3: Captura al centro ---
                        setTimeout(() => {
                            challenge.textContent = "3. Ahora, mira al CENTRO.";
                            capturarFoto(); // Foto 4
                            
                            // --- PASO 4: Captura a la izquierda ---
                            setTimeout(() => {
                                challenge.textContent = "4. Ahora, gira a la IZQUIERDA.";
                                capturarFoto(); // Foto 5
                                
                                setTimeout(() => {
                                    capturarFoto(); // Foto 6
                                    
                                    // --- PASO 5: Captura final (con el código) ---
                                    setTimeout(() => {
                                        challenge.innerHTML = `5. Mira al CENTRO:<br><strong style="color:red; font-size:1.5em;">"Mi código es ${codigoSecreto}"</strong>`;
                                        capturarFoto(); // Foto 7
                                        
                                        setTimeout(() => {
                                            capturarFoto(); // Foto 8
                                            capturarFoto(); // Foto 9
                                            
                                            // --- PASO FINAL: Procesar el collage ---
                                            procesarCollage(frames);
                                        }, 2000);
                                    }, 3000);
                                }, 3000);
                            }, 3000);
                        }, 3000);
                    }, 3000);
                }, 3000);
            }, 3000);
        }

        function procesarCollage(frames) {
            challenge.textContent = "Procesando tu verificación... un momento.";
            
            const collageWidth = video.videoWidth * 3;
            const collageHeight = video.videoHeight * 3;
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = collageWidth;
            canvas.height = collageHeight;

            frames.forEach((frameCanvas, index) => {
                const x = (index % 3) * video.videoWidth;
                const y = Math.floor(index / 3) * video.videoHeight;
                ctx.drawImage(frameCanvas, x, y);
            });
            
            aplicarSelloDeSeguridad(ctx, collageWidth, collageHeight);
            guardarCollageEnGaleria(canvas, token);

            video.srcObject = null;
            recordBtn.style.display = 'none';
            sendBtn.style.display = 'block';

            challenge.innerHTML = `
                <div style="text-align: center; font-size: 18px; color: #333; font-weight: bold;">
                    ✅ ¡Verificación completada!<br><br>
                    <span style="font-size: 16px; color: #0056b3;">Se ha generado tu imagen de seguridad.</span>
                </div>
            `;
            
            sendBtn.textContent = "SELECCIONAR Y ENVIAR IMAGEN";
        }

        // --- FUNCIÓN DE SELLO SUPERAGRESIVO ---
        function aplicarSelloDeSeguridad(ctx, collageWidth, collageHeight) {
            ctx.save();
            ctx.globalAlpha = 0.05;
            ctx.fillStyle = '#000';
            for (let i = 0; i < collageWidth; i += 2) {
                for (let j = 0; j < collageHeight; j += 2) {
                    if ((i + j) % 4 === 0) {
                        ctx.fillRect(i, j, 2, 2);
                    }
                }
            }
            ctx.restore();

            const fecha = new Date();
            const textoPrincipal = `VERIFICACIÓN - MASTERCHL\nToken: ${token}\nCódigo: ${codigoSecreto}\nFecha: ${fecha.toLocaleString()}`;
            
            const tamanoFuente = 100; 
            ctx.font = `bold ${tamanoFuente}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            
            const cellWidth = collageWidth / 3;
            const cellHeight = collageHeight / 3;
            
            for (let fila = 0; fila < 3; fila++) {
                for (let col = 0; col < 3; col++) {
                    const xCentro = (col * cellWidth) + (cellWidth / 2);
                    const yCentro = (fila * cellHeight) + (cellHeight / 2);
                    
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    
                    ctx.strokeText(textoPrincipal, xCentro, yCentro - 50);
                    ctx.fillText(textoPrincipal, xCentro, yCentro - 50);
                    
                    ctx.globalAlpha = 0.4;
                    ctx.strokeText(textoPrincipal, xCentro + 5, yCentro - 45);
                    ctx.fillText(textoPrincipal, xCentro + 5, yCentro - 45);
                    ctx.globalAlpha = 1.0;
                    
                    ctx.save();
                    ctx.translate(xCentro, yCentro);
                    ctx.scale(1, -1);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillText(textoPrincipal, 0, 0);
                    ctx.restore();
                }
            }
        }

        function guardarCollageEnGaleria(canvas, token) {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `verificacion-${token}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // --- 6. BOTÓN DE WHATSAPP CON INTEGRACIÓN DE GALERÍA ---
        sendBtn.addEventListener('click', () => {
            sendBtn.disabled = true;
            sendBtn.textContent = "ABRIENDO GALERÍA...";
            
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/png';
            fileInput.onchange = () => {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const mensaje = `🔒 VERIFICACIÓN MASTERCHL%0A%0A👤 Usuario: ${token}%0A%0A✅ Código verificado: ${codigoSecreto}%0A%0A✅ Verificación en proceso. Confirmo que soy real.`;
                        const url = `https://wa.me/${MY_WHATSAPP}?text=${mensaje}`;
                        
                        window.open(url, '_blank');
                        
                        successMsg.textContent = "¡Abre WhatsApp y envía la imagen que seleccionaste!";
                        successMsg.style.display = 'block';
                        mainContent.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                }
            };
            fileInput.click();
        });

    </script>
</body>
</html>
