<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación - MasterCHL</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 5px solid #0056b3;
        }
        .logo-img {
            max-width: 150px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1 { color: #222; font-size: 24px; margin: 0 0 5px 0; text-transform: uppercase; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .video-box {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .challenge-box {
            background-color: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
            font-weight: bold;
            color: #004494;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .instructions {
            background-color: #e7f3ff;
            border: 1px solid #b3d9ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #0056b3;
            text-align: left;
        }
        .instructions strong { color: #004494; }
        
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
            width: 100%;
        }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .error { color: #d9534f; background: #fff5f5; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #f5c6cb; display: none; }
        .success { color: #28a745; background: #f0fff4; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #c3e6cb; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TU LOGO (AQUÍ) -->
        <img src="https://i.ibb.co/h1Z6dp9Z/whtsap.jpg" alt="Logo" class="logo-img">
        
        <h1>Verificación de Identidad</h1>
        <div class="subtitle">Atte: El MasterCHL, Creador de Cuentas</div>

        <div id="error-msg" class="error"></div>
        <div id="success-msg" class="success"></div>

        <div id="main-content">
            <div class="video-box">
                <video id="video" autoplay playsinline muted></video>
            </div>

            <div class="challenge-box" id="challenge">
                Presiona "INICIAR CÁMARA" para comenzar.
            </div>

            <button id="startBtn">INICIAR CÁMARA</button>
            <button id="recordBtn" style="display:none;">GRABAR...</button>
            <button id="sendBtn" style="display:none;">ENVIAR A WHATSAPP</button>

            <div class="instructions" id="finalInstruct" style="display:none;">
                <strong>⚠️ IMPORTANTE:</strong> Al enviar, se abrirá WhatsApp. <br>
                <strong>Debes adjuntar el video</strong> que grabaste desde tu galería antes de enviar el mensaje.
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN (CAMBIA ESTOS DATOS) ---
        // TU ENLACE DE GOOGLE SHEETS (CSV)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQuh8HzH802xZYnxlX_lBiT2x_vqfcyluC9hEAEtfKll4Oz1CdhD-SaKRqhsJAWWD1_V4SHnOpjuvad/pub?output=csv&t=' + new Date().getTime();
        
        // TU NÚMERO DE WHATSAPP (56939229459)
        const MY_WHATSAPP = "56939229459";

        // --- 2. VARIABLES ---
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const recordBtn = document.getElementById('recordBtn');
        const sendBtn = document.getElementById('sendBtn');
        const challenge = document.getElementById('challenge');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const mainContent = document.getElementById('main-content');
        const finalInstruct = document.getElementById('finalInstruct');

        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        
        // Generar código secreto único para ESTA sesión
        const palabras = ['CASA', 'PERRO', 'SOL', 'FUEGO', 'LUNA', 'ROJO', 'AZUL', 'VERDE'];
        const codigoSecreto = palabras[Math.floor(Math.random() * palabras.length)] + '-' + Math.floor(Math.random() * 9 + 1);

        // --- 3. VALIDAR TOKEN ---
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showError("Enlace no válido. Faltan los parámetros.");
        } else {
            verificarToken(token);
        }

        async function verificarToken(tokenBuscado) {
            try {
                const res = await fetch(SHEET_URL);
                const data = await res.text().then(t => t.replace(/['"]/g, '').replace(/\r/g, ''));
                const rows = data.split('\n');
                
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    const cols = rows[i].split(',');
                    const link = cols[0] ? cols[0].trim() : '';
                    const estado = cols[1] ? cols[1].trim() : '';

                    if (link === `https://masterchl176-lang.github.io/verificacion-masterchl/?token=${tokenBuscado}`) {
                        if (estado === 'disponible') {
                            iniciarSistema();
                            return;
                        } else if (estado === 'usado') {
                            showError("Este enlace ya ha sido usado anteriormente.");
                            return;
                        }
                    }
                }
                showError("Enlace no encontrado en el sistema.");
            } catch (err) {
                console.error(err);
                showError("Error de conexión. Revisa tu hoja.");
            }
        }

        function showError(msg) {
            mainContent.style.display = 'none';
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function iniciarSistema() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        // --- 4. CÁMARA ---
        startBtn.addEventListener('click', async () => {
            try {
                // PARAR cámaras anteriores si existen (para evitar duplicados)
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                startBtn.style.display = 'none';
                recordBtn.style.display = 'block';
                challenge.textContent = "Por favor, espera a que empiece la grabación...";
                
                // Iniciar secuencia de pasos después de 1 seg
                setTimeout(iniciarPasos, 1000);
            } catch (err) {
                alert("Error al acceder a la cámara: " + err.message);
            }
        });

        function iniciarPasos() {
            // Paso 1: Derecha (5 segundos para leer)
            challenge.textContent = "1. Gira tu cabeza a la DERECHA";
            
            setTimeout(() => {
                // Paso 2: Izquierda (5 segundos para leer)
                challenge.textContent = "2. Gira tu cabeza a la IZQUIERDA";
                
                setTimeout(() => {
                    // Paso 3: Código Secreto (SE QUEDA AQUÍ HASTA QUE PRESIONES ENVIAR)
                    challenge.innerHTML = `3. Mira al CENTRO y di en voz alta:<br><strong style="color:red; font-size:1.5em;">"Mi código es ${codigoSecreto}"</strong><br><span style="font-size:14px; color:#555;">(No cierres la ventana, espera la grabación)</span>`;
                    
                    // La grabación comienza automáticamente después de 3 segundos de mostrar el código
                    setTimeout(iniciarGrabacion, 3000);
                }, 5000); // 5 segundos para ver el código
            }, 5000); // 5 segundos para el primer paso
        }

        function iniciarGrabacion() {
            challenge.textContent = "Grabando... (10 segundos)";
            recordBtn.textContent = "GRABANDO...";
            recordBtn.disabled = true;
            
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                // Detener cámara y cambiar botones
                video.srcObject = null; 
                recordBtn.style.display = 'none';
                sendBtn.style.display = 'block';

                // --- NUEVO: MOSTRAR LA GUÍA DE PASOS ---
                challenge.innerHTML = `
                    <div style="text-align: left; font-size: 14px; color: #333;">
                        <strong>✅ ¡Video grabado con éxito!</strong><br><br>
                        <strong>Paso 1:</strong> Minimiza esta página (no la cierres).<br><br>
                        <strong>Paso 2:</strong> Abre tu <strong>Galería</strong> (o "Fotos").<br><br>
                        <strong>Paso 3:</strong> Busca el video más reciente. Se llama <strong>"video.webm"</strong> o similar.<br><br>
                        <strong>Paso 4:</strong> Abre WhatsApp, busca este chat y presiona el ícono del clip 📎.<br><br>
                        <strong>Paso 5:</strong> Selecciona "Galería", busca tu video y envíalo.<br><br>
                        <em>Cuando hayas enviado el video, vuelve aquí y presiona "YA ENVIÉ".</em>
                    </div>
                `;
                
                // Cambiar el texto del botón para que sea más claro
                sendBtn.textContent = "YA ENVIÉ EL VIDEO";
            };

            mediaRecorder.start();

            // Detener grabación automática a los 10 segundos
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, 10000);
        }
        // --- 5. ENVIAR A WHATSAPP ---
        sendBtn.addEventListener('click', () => {
            sendBtn.disabled = true;
            sendBtn.textContent = "CONFIRMANDO...";
            
            // Mensaje de confirmación (ya no pide adjuntar video)
            const mensaje = `🔒 VERIFICACIÓN MASTERCHL%0A%0A👤 Usuario: ${token}%0A%0A✅ Código verificado: ${codigoSecreto}%0A%0A✅ El usuario confirma haber adjuntado el video correctamente.`;
            
            const url = `https://wa.me/${MY_WHATSAPP}?text=${mensaje}`;
            
            // Mostrar éxito y abrir WhatsApp
            successMsg.textContent = "¡Proceso completado! El MasterCHL revisará tu caso.";
            successMsg.style.display = 'block';
            mainContent.style.display = 'none';
            
            setTimeout(() => {
                window.open(url, '_blank');
            }, 500);
        });

    </script>
</body>
</html>
